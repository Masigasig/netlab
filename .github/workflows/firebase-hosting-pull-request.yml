# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          
      # Remove .env from pubspec.yaml so it's not bundled in production
      - name: Remove .env from pubspec.yaml
        run: sed -i '/- .env/d' pubspec.yaml

      # Build with secrets injected via --dart-define
      - name: Build Flutter Web
        run: flutter build web --release \ 
          --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \ 
          --dart-define=GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \ 
          --dart-define=WEB_AND_WINDOWS_FIREBASE_API_KEY=${{ secrets.WEB_AND_WINDOWS_FIREBASE_API_KEY }} \ 
          --dart-define=ANDROID_FIREBASE_API_KEY=${{ secrets.ANDROID_FIREBASE_API_KEY }} \ 
          --dart-define=IOS_AND_MACOS_FIREBASE_API_KEY=${{ secrets.IOS_AND_MACOS_FIREBASE_API_KEY }} \ 
          --dart-define=WEB_APPID=${{ secrets.WEB_APPID }} \ 
          --dart-define=ANDROID_APPID=${{ secrets.ANDROID_APPID }} \ 
          --dart-define=IOS_MACOS_APPID=${{ secrets.IOS_MACOS_APPID }} \ 
          --dart-define=WINDOWS_APPID=${{ secrets.WINDOWS_APPID }} \ 
          --dart-define=MESSAGING_SENDER_ID=${{ secrets.MESSAGING_SENDER_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NETLAB_8C22E }}
          projectId: netlab-8c22e
        env: 
          FIREBASE_CLI_EXPERIMENTS: webframeworks
